<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — PropFlow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0b0b;
      color: #fff;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    h1 {
      font-size: 24px;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: rgba(255,255,255,0.55);
      line-height: 1.6;
      max-width: 320px;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 20px;
      opacity: 0.5;
    }
  </style>
<base target="_blank">
</head>
<body>
  <div>
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>Your meter readings and payments will sync automatically when your connection returns.</p>
  </div>
</body>
</html>
